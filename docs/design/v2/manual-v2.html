document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d401-a040-494a-bef3-0ff155aefa1a\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"375bbf9f-09f8-4b04-a4d2-a3c1d2d497d9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"170dcc7c-19b2-4a46-92e4-77daf1485843\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle><style>body{margin:0;background:#f1ede4;color:#1c1a17;font-family:'Archivo',sans-serif}a{color:#9E2A1E}a:hover{color:#1c1a17}<\u002Fstyle><\u002Fhelmet>\n<div style=\"max-width:1200px;margin:0 auto;padding:48px 32px 96px;display:flex;flex-direction:column;gap:72px\">\n\n<header style=\"display:flex;flex-direction:column;gap:18px;border-bottom:4px solid #1c1a17;padding-bottom:28px\">\n  <div style=\"display:flex;justify-content:space-between;font:700 11px 'Space Mono'\"><span>MANUAL DE IDENTIDADE · v2.0 · NOV 2026<\u002Fspan><span>PROPRIEDADE POPULAR · COPIE À VONTADE<\u002Fspan><\u002Fdiv>\n  <div style=\"display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap\"><div style=\"background:#9E2A1E;padding:12px 22px 4px\"><div style=\"font:900 140px/0.85 'Archivo';font-stretch:62%;color:#f1ede4\">PUKAS<\u002Fdiv><\u002Fdiv><div style=\"font:900 44px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase;max-width:480px;padding-bottom:8px\">Como falar com a classe inteira sem perder a cara.<\u002Fdiv><\u002Fdiv>\n  <div style=\"font-size:15px;line-height:1.5;max-width:760px;color:rgba(28,26,23,.75)\">Premissas desta versão: a Tarja (<a href=\"PUKAS Identidade.dc.html#1a\">1a<\u002Fa>) é a marca principal, o Carimbo (<a href=\"PUKAS Identidade.dc.html#1b\">1b<\u002Fa>) é a secundária, e Tinta #1C1A17 entra como cor funcional. Se alguma premissa mudar, este manual muda com ela.<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">01<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Princípios<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;background:#1c1a17;border:2px solid #1c1a17\">\n    <div style=\"background:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase\">A frase vem primeiro<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">Toda peça nasce de uma frase que alguém diria no ponto de ônibus. Se precisar de glossário, a peça não está pronta.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase\">Gente de verdade<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">Trabalhadores, objetos e lugares reais. Nunca banco de imagem e nunca político sorrindo.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase\">Esqueleto fixo, miolo livre<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">Logo, selo de editoria, rodapé e margens nunca mudam. É isso que permite ousar no centro sem perder a unidade.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase\">Sobrevive à xerox<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">Se a peça morre em P&amp;B, ela depende de cor demais. A tinta preta carrega a mensagem; a cor carrega a marca.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase\">Reproduzível à mão<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">Toda marca e todo elemento pode ser feito com carimbo, estêncil ou caneta. A linguagem é da classe, não da agência.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#9E2A1E;color:#f1ede4;padding:20px;display:flex;flex-direction:column;gap:8px\"><div style=\"font:900 28px/0.95 'Archivo';font-stretch:65%;text-transform:uppercase;color:#E0A526\">Vermelho sempre<\u002Fdiv><div style=\"font-size:14px;line-height:1.45\">O Pau-Brasil está em toda peça, e é ele que dá nome à marca. Sem ele, verde e amarelo viram outra bandeira.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">02<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Marca<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1;background:#fbfaf7;display:flex;align-items:center;justify-content:center\"><div style=\"background:#9E2A1E;padding:8px 16px 3px\"><div style=\"font:900 80px/0.9 'Archivo';font-stretch:62%;color:#f1ede4\">PUKAS<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">PRINCIPAL · TARJA<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Topo de toda peça digital, cabeçalho de panfleto, adesivo. Margem mínima ao redor: a altura do \"U\".<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1;background:#fbfaf7;display:flex;align-items:center;justify-content:center\"><div style=\"transform:rotate(-4deg);border:4px solid #9E2A1E;outline:2px solid #9E2A1E;outline-offset:4px;padding:8px 14px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9E2A1E\"><div style=\"font:700 9px 'Space Mono';letter-spacing:.2em\">ARQUIVO POPULAR<\u002Fdiv><div style=\"font:400 60px/0.9 'Anton'\">PUKAS<\u002Fdiv><div style=\"font:700 9px 'Space Mono';border-top:2px solid #9E2A1E;padding-top:3px\">Nº 0207<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">SECUNDÁRIA · CARIMBO<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Dossiês, documentos e intervenção física. O número é único por peça e é gerado pelo app.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"aspect-ratio:1;background:#1c1a17;display:flex;align-items:center;justify-content:center\"><div style=\"background:#f1ede4;padding:8px 16px 3px\"><div style=\"font:900 80px/0.9 'Archivo';font-stretch:62%;color:#1c1a17\">PUKAS<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">1 COR · XEROX / ESTÊNCIL<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Tarja em Tinta sobre papel ou em Cal sobre Tinta. É a única versão permitida em P&amp;B.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font:700 11px 'Space Mono';margin-top:12px\">SELOS DE EDITORIA · sempre no canto superior direito, sempre em Space Mono<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">DOSSIÊ Nº__*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">TRINCHEIRA*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">CONJUNTURA*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">FRONTEIRA*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">DICIONÁRIO*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">MEMÓRIA OPERÁRIA*<\u002Fdiv>\n    <div style=\"border:2px solid #1c1a17;padding:6px 10px;font:700 12px 'Space Mono'\">PUKAS × PARCEIRO<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:14px;line-height:1.5;max-width:760px\">O asterisco é o fecho da marca, como uma nota de rodapé: \"tem mais pra saber\". A assinatura fixa do rodapé é <b>\"PUKAS · A TEORIA VOLTA A SER ARMA*\"<\u002Fb>. O antigo \"Órgão de Mídia &amp; Inteligência\" fica só no site institucional.<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">03<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Cor<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;border:2px solid #1c1a17\">\n    <div style=\"background:#9E2A1E;color:#f1ede4;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font:900 26px/1 'Archivo';font-stretch:65%\">PAU-BRASIL<\u002Fdiv><div style=\"font:700 11px/1.5 'Space Mono'\">#9E2A1E<br>RUPTURA · MARCA<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1c1a17;color:#f1ede4;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font:900 26px/1 'Archivo';font-stretch:65%\">TINTA<\u002Fdiv><div style=\"font:700 11px/1.5 'Space Mono'\">#1C1A17<br>TEXTO · RETÍCULA<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;color:#1c1a17;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;border-left:2px solid #1c1a17\"><div style=\"font:900 26px/1 'Archivo';font-stretch:65%\">CAL<\u002Fdiv><div style=\"font:700 11px/1.5 'Space Mono'\">#F1EDE4<br>PAPEL · LEITURA<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#E0A526;color:#1c1a17;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font:900 26px/1 'Archivo';font-stretch:65%\">IPÊ<\u002Fdiv><div style=\"font:700 11px/1.5 'Space Mono'\">#E0A526<br>DESTAQUE · DADO<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1A452C;color:#E0A526;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font:900 26px/1 'Archivo';font-stretch:65%\">VERDE-MATA<\u002Fdiv><div style=\"font:700 11px/1.5 'Space Mono'\">#1A452C<br>MÓDULO TÉCNICO<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;height:28px\"><div style=\"flex:5;background:#9E2A1E\"><\u002Fdiv><div style=\"flex:3;background:#1c1a17\"><\u002Fdiv><div style=\"flex:2;background:#f1ede4;border:1px solid #1c1a17\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">AGITAÇÃO · lambe, carrossel, pílula<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;height:28px\"><div style=\"flex:6;background:#f1ede4;border:1px solid #1c1a17\"><\u002Fdiv><div style=\"flex:3;background:#1c1a17\"><\u002Fdiv><div style=\"flex:1;background:#9E2A1E\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">LEITURA · newsletter, ensaio, panfleto<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;height:28px\"><div style=\"flex:5;background:#1A452C\"><\u002Fdiv><div style=\"flex:3;background:#E0A526\"><\u002Fdiv><div style=\"flex:2;background:#9E2A1E\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">TÉCNICO · dicionário, dados, simulador<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:14px;line-height:1.5;max-width:760px\">Cada peça usa uma das três receitas. Use no máximo 3 cores e não misture receitas. Ipê sobre Verde-Mata só aparece no técnico; no feed, essa dupla vira bandeira.<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">04<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Tipografia<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:2px;background:#1c1a17;border:2px solid #1c1a17\">\n    <div style=\"background:#f1ede4;padding:18px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center\"><div style=\"font:700 11px/1.5 'Space Mono'\">MANCHETE<br>Archivo 900 · 62%<br>caixa alta · 0.86<\u002Fdiv><div style=\"font:900 64px/0.86 'Archivo';font-stretch:62%;text-transform:uppercase\">Quem lucra com o seu cansaço?<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:18px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center\"><div style=\"font:700 11px/1.5 'Space Mono'\">CORPO<br>Archivo 400–700 · 100%<br>16–18px · 1.45<\u002Fdiv><div style=\"font-size:18px;line-height:1.45;max-width:620px\">A tarifa subiu de novo. A empresa diz que é o diesel, mas o diesel caiu. Neste dossiê a gente mostra para onde foi o dinheiro.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:18px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center\"><div style=\"font:700 11px/1.5 'Space Mono'\">MÁQUINA<br>Space Mono 700<br>selos · dados · rodapé<\u002Fdiv><div style=\"font:700 15px 'Space Mono'\">DOSSIÊ Nº 0207 · FONTE: DIÁRIO OFICIAL · ›››<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#f1ede4;padding:18px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:20px;align-items:center\"><div style=\"font:700 11px/1.5 'Space Mono'\">CARIMBO<br>Anton<br>só dentro do carimbo<\u002Fdiv><div style=\"font:400 40px/1 'Anton';color:#9E2A1E\">ARQUIVO POPULAR<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">05<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Repertório visual<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"aspect-ratio:4/5;background-color:#f1ede4;background-image:radial-gradient(circle,#9E2A1E 1.6px,transparent 2px);background-size:6px 6px\"><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">RETÍCULA 1 COR<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Foto em retícula Pau-Brasil sobre papel. Tratamento padrão de capa.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"aspect-ratio:4/5;background:#9E2A1E;position:relative\"><div style=\"position:absolute;inset:18% 22%;background:#f1ede4;clip-path:polygon(30% 0,70% 4%,85% 40%,100% 100%,0 100%,12% 42%)\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">LIMIAR (THRESHOLD)<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Foto reduzida a 2 tons, Cal sobre Pau-Brasil. Ideal pra rosto e protesto.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"aspect-ratio:4/5;background:#d8d4ca;position:relative\"><div style=\"position:absolute;left:30%;top:20%;width:40%;height:65%;background:#9E2A1E\"><\u002Fdiv><div style=\"position:absolute;inset:0;background-image:radial-gradient(circle,#1c1a17 1px,transparent 1.4px);background-size:4px 4px;mix-blend-mode:multiply\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">P&amp;B + UMA ÁREA<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Foto de arquivo em P&amp;B e só uma pessoa ou objeto em vermelho.<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"aspect-ratio:4/5;background:#f1ede4;position:relative;display:flex;align-items:center;justify-content:center\"><div style=\"width:55%;height:45%;background:#1c1a17;transform:rotate(-6deg);box-shadow:8px 8px 0 #9E2A1E\"><\u002Fdiv><\u002Fdiv><div style=\"font:700 11px 'Space Mono'\">OBJETO RECORTADO<\u002Fdiv><div style=\"font-size:13px;line-height:1.4\">Marmita, capacete, catraca ou carteira de trabalho recortados, com sombra chapada.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font:700 11px 'Space Mono';margin-top:8px\">ELEMENTOS<\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:center\">\n    <div style=\"font:900 30px/1 'Archivo';font-stretch:65%;text-transform:uppercase;background:linear-gradient(transparent 55%,#E0A526 55%);padding:0 4px\">marca-texto<\u002Fdiv>\n    <div style=\"font:900 30px/1 'Archivo';font-stretch:65%;text-transform:uppercase;text-decoration:line-through;text-decoration-color:#9E2A1E;text-decoration-thickness:5px\">rasura<\u002Fdiv>\n    <div style=\"font:900 30px/1 'Archivo';font-stretch:65%;text-transform:uppercase\">tarja <span style=\"background:#1c1a17;color:#1c1a17\">censurada<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#9E2A1E;color:#f1ede4;font:900 22px/1 'Archivo';font-stretch:65%;padding:6px 10px 3px;transform:rotate(-3deg)\">FAIXA DE CHAMADA<\u002Fdiv>\n    <div style=\"font:700 22px 'Space Mono';color:#9E2A1E\">›››<\u002Fdiv>\n    <div style=\"font:900 40px/1 'Archivo';color:#9E2A1E\">*<\u002Fdiv>\n    <div style=\"background:#1c1a17;color:#f1ede4;font:700 11px 'Space Mono';padding:5px 8px;letter-spacing:.1em\">PUKAS PUKAS PUKAS PUKAS<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">06<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Faça · Não faça<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px\">\n    <div style=\"display:flex;flex-direction:column;border-top:6px solid #1c1a17\">\n      <div style=\"font:900 30px/1 'Archivo';font-stretch:65%;padding:12px 0\">FAÇA<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Manchete de até 8 palavras, como pergunta ou acusação direta.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Uma imagem dominante por peça, ocupando ao menos 40% da área.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Dar nome, idade, ofício e cidade de quem fala.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Citar a fonte do dado em Space Mono, sempre visível.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Terminar com uma ação: passe adiante, tire xerox, mande pro grupo.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #1c1a17;font-size:14.5px;line-height:1.4\">Grão e borda comida no texto grande; corpo de texto sempre limpo.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;border-top:6px solid #9E2A1E\">\n      <div style=\"font:900 30px/1 'Archivo';font-stretch:65%;padding:12px 0;color:#9E2A1E\">NÃO FAÇA<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Jargão sem tradução: \"hegemonia\", \"práxis\", \"conjuntura\" só no ensaio, nunca na manchete.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Fundo Verde-Mata com texto Ipê no feed. Lê como bandeira.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Foice e martelo, estrela ou rosto de líder como atalho visual. Mostre o trabalhador.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Mais de 3 cores, gradiente, sombra suave, canto arredondado.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Textura sobre corpo de texto ou colagem que esconde a manchete.<\u002Fdiv>\n      <div style=\"padding:10px 0;border-top:1px solid #9E2A1E;font-size:14.5px;line-height:1.4\">Esticar, girar ou recolorir a Tarja fora das 3 versões.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;gap:16px;align-items:baseline\"><div style=\"font:700 12px 'Space Mono';color:#9E2A1E\">07<\u002Fdiv><div style=\"font:900 56px/0.9 'Archivo';font-stretch:62%;text-transform:uppercase\">Casos de uso<\u002Fdiv><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;border:2px solid #1c1a17\">\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:10px 14px;background:#1c1a17;color:#f1ede4;font:700 11px 'Space Mono'\"><span>PEÇA<\u002Fspan><span>RECEITA<\u002Fspan><span>MARCA<\u002Fspan><span>MÓDULO / REGRA<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Carrossel-Manifesto<\u002Fb><span>Agitação<\u002Fspan><span>Tarja<\u002Fspan><span>Esqueleto fixo + capa, texto, citação, chamada<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Pílula de Reação<\u002Fb><span>Agitação<\u002Fspan><span>Tarja<\u002Fspan><span>Capa 9:16, manchete no terço superior, legenda Cal sobre Tinta<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Lambe-lambe<\u002Fb><span>Agitação<\u002Fspan><span>Tarja<\u002Fspan><span>A3, manchete legível a 5 m, URL curta no rodapé<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Panfleto<\u002Fb><span>Leitura (P&amp;B)<\u002Fspan><span>Tarja 1 cor<\u002Fspan><span>A5, 1 manchete, 3 parágrafos, QR, \"passe adiante\"<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Dossiê Quinzenal<\u002Fb><span>Agitação → Leitura<\u002Fspan><span>Carimbo + nº<\u002Fspan><span>Capa em retícula; interior em Cal, ensaio longo<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Newsletter<\u002Fb><span>Leitura<\u002Fspan><span>Tarja<\u002Fspan><span>Corpo 18px, manchete só no topo, 1 imagem<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Dicionário / Dados<\u002Fb><span>Técnico<\u002Fspan><span>Tarja<\u002Fspan><span>Janela-terminal; número gigante + fonte em Mono<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Card Raio-X de Classe<\u002Fb><span>Técnico<\u002Fspan><span>Carimbo + nº<\u002Fspan><span>Resultado = frase pessoal + dado; feito pra compartilhar<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Série recorrente<\u002Fb><span>Agitação (gira)<\u002Fspan><span>Tarja<\u002Fspan><span>Título e imagem fixos, só a frase muda; cor gira entre as 3 receitas<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr 1fr 1.6fr;gap:12px;padding:12px 14px;border-top:1px solid #1c1a17;font-size:14px\"><b>Parceria<\u002Fb><span>Do PUKAS<\u002Fspan><span>PUKAS × Parceiro<\u002Fspan><span>Logo do parceiro em caixa Cal no canto esquerdo<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:4px solid #1c1a17;padding-top:14px;display:flex;justify-content:space-between;font:700 11px 'Space Mono'\"><span>PUKAS · A TEORIA VOLTA A SER ARMA*<\u002Fspan><span>›››<\u002Fspan><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
